name: opencode

on:
  # `issue_comment` is flagged as a dangerous trigger because it is
  # attacker-triggerable. Here the job-level `if` below restricts execution to
  # the repository owner, members and collaborators, no pull request code is
  # executed, and permissions are minimal (see the `permissions` block), so the
  # trigger is safe in this workflow.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # `issue_comment` / `pull_request_review_comment` are attacker-triggerable
    # events, so only trusted users may run the agent. Without this check any
    # commenter could invoke it with repository secrets and write permissions.
    if: |
      (github.actor == github.repository_owner ||
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      # Minimal permissions; the OpenCode app installation token (obtained via
      # OIDC) provides the permissions used to comment and push changes.
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode (Repository Owner)
        if: github.actor == github.repository_owner
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/qwen3.7-plus
          prompt: |
            Review this pull request and provide feedback.
            Reference the following files for guidelines:
            - .github/agents/code-reviewer.agent.md
            - .github/agents/commit-message-advisor.agent.md
            - .github/agents/pr-contributor.agent.md
            - CONTRIBUTING.md
            
            When creating or reviewing PRs:
            - Follow the commit message format specified in commit-message-advisor.agent.md
            - Apply code review standards from code-reviewer.agent.md
            - Ensure PR title and description follow pr-contributor.agent.md guidelines
            - Adhere to CONTRIBUTING.md for overall contribution standards

      - name: Run opencode (Other Contributors)
        if: github.actor != github.repository_owner
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: |
            Review this pull request and provide feedback.
            Reference the following files for guidelines:
            - .github/agents/code-reviewer.agent.md
            - .github/agents/commit-message-advisor.agent.md
            - .github/agents/pr-contributor.agent.md
            - CONTRIBUTING.md
            
            When creating or reviewing PRs:
            - Follow the commit message format specified in commit-message-advisor.agent.md
            - Apply code review standards from code-reviewer.agent.md
            - Ensure PR title and description follow pr-contributor.agent.md guidelines
            - Adhere to CONTRIBUTING.md for overall contribution standards
