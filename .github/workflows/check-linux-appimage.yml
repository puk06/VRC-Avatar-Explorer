name: Check Linux AppImage Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Application (linux-x64)
        run: |
          dotnet publish "./AvatarExplorer.UI/AvatarExplorer.UI.csproj" -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp publish/AvatarExplorer AppDir/usr/bin/AvatarExplorer
          cp .github/appimage/AppRun AppDir/AppRun
          cp .github/appimage/avatar-explorer.desktop AppDir/
          cp .github/appimage/avatar-explorer.desktop AppDir/usr/share/applications/
          cp .github/appimage/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/avatar-explorer.png
          chmod +x AppDir/AppRun AppDir/usr/bin/AvatarExplorer

          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir VRC-Avatar-Explorer_0.0.0-ci-linux-x64.AppImage

      - name: Verify AppImage output exists
        run: |
          if [ ! -f "VRC-Avatar-Explorer_0.0.0-ci-linux-x64.AppImage" ]; then
            echo "AppImage was not generated"
            exit 1
          fi
