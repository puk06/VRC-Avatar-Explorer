name: Cross Platform Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # managed SkiaSharp と native libSkiaSharp のバージョンはビルドでは検証されないため、
      # 依存パッケージの変更時に不整合を検出する。project.assets.json は全 RID の情報を持つので、
      # Linux ジョブ 1 回で Windows / macOS 向けの不整合も検出できる。
      - name: Verify SkiaSharp native assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="AvatarExplorer.UI/obj/project.assets.json"
          MANAGED=$(jq -r '.libraries | keys[] | select(test("^SkiaSharp/")) | split("/")[1]' "$ASSETS" | tr -d '\r')
          echo "managed SkiaSharp: $MANAGED"

          mapfile -t PROVIDERS < <(
            jq -r '.targets[]
              | to_entries[]
              | select((.value.runtimeTargets // {}) | keys | any(test("libSkiaSharp[.](so|dylib|dll)$")))
              | .key' "$ASSETS" | tr -d '\r' | sort -u
          )

          for PKG in "${PROVIDERS[@]}"; do
            echo "native provider: $PKG"
            if [ "${PKG#*/}" != "$MANAGED" ]; then
              echo "::error::SkiaSharp native/assets mismatch: $PKG (managed SkiaSharp: $MANAGED)"
              exit 1
            fi
          done

      - name: SkiaSharp smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: AVATAREXPLORER_SKIA_SMOKE_TEST=1 ./AvatarExplorer.UI/bin/Release/net10.0/AvatarExplorer

      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="AvatarExplorer.UI/bin/Release/net10.0/VRC-Avatar-Explorer.app"
          plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/AvatarExplorer"
          test -s "$APP/Contents/Resources/SoftwareIcon.icns"
          test -s "$APP/Contents/MacOS/locales/ja-JP.json"
          test -s "$APP/Contents/MacOS/LICENSE"
          test -s "$APP/Contents/MacOS/THIRD_PARTY_LICENSES.md"
          codesign --verify --deep --strict "$APP"

      - name: Verify repeated macOS publish
        if: runner.os == 'macOS'
        shell: bash
        run: |
          OUTPUT="$RUNNER_TEMP/publish macos"
          for MODE in build no-build; do
            OPTIONS=()
            if [ "$MODE" == "no-build" ]; then OPTIONS+=(--no-build); fi
            dotnet publish AvatarExplorer.UI/AvatarExplorer.UI.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o "$OUTPUT" "${OPTIONS[@]}"
            APP="$OUTPUT/VRC-Avatar-Explorer.app"
            test -x "$APP/Contents/MacOS/AvatarExplorer"
            test -s "$APP/Contents/MacOS/locales/ja-JP.json"
            test -s "$APP/Contents/MacOS/LICENSE"
            test -s "$APP/Contents/MacOS/THIRD_PARTY_LICENSES.md"
            test -s "$APP/Contents/MacOS/libAvaloniaNative.dylib"
            test -s "$APP/Contents/MacOS/libSkiaSharp.dylib"
            test -s "$APP/Contents/MacOS/libHarfBuzzSharp.dylib"
            test -s "$APP/Contents/MacOS/libpdfium.dylib"
            codesign --verify --deep --strict "$APP"
          done
