id: com.github.puk06.vrc_avatar_explorer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --env=DOTNET_ROOT=/app/lib/dotnet
command: /app/bin/AvatarExplorer/AvatarExplorer

modules:
  - name: VRC-Avatar-Explorer
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet10/bin
      append-ld-library-path: /usr/lib/sdk/dotnet10/lib
      prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
    
    build-commands:
      - install.sh

      - install -d /app/bin/AvatarExplorer
      - cp -a ./publish/* /app/bin/AvatarExplorer

      - install -Dm 644 -t /app/share/applications $FLATPAK_ID.desktop
      - install -Dm 644 -t /app/share/applications $FLATPAK_ID.booth-library-manager.desktop
      - install -Dm 644 -t /app/share/applications $FLATPAK_ID.vrcae.desktop
      - install -Dm 644 ./publish/Assets/SoftwareIcon-128x128.png /app/share/icons/hicolor/128x128/apps/$FLATPAK_ID.png
      - install -Dm 644 $FLATPAK_ID.metainfo.xml -t /app/share/metainfo

    sources:

      - type: dir
        path: ./publish
        dest: ./publish

      # - type: git
      #   url: https://github.com/ReinaS-64892/VRC-Avatar-Explorer.git
      #   commit: eb554fbc9008feb02331e68611309086b01d13de
      
      # - type: dir
      #   path: nuget-sources
      #   dest: ./nuget-sources
      # - nuget-source.json

      - type: file
        path: com.github.puk06.vrc_avatar_explorer.desktop
      - type: file
        path: com.github.puk06.vrc_avatar_explorer.booth-library-manager.desktop
      - type: file
        path: com.github.puk06.vrc_avatar_explorer.vrcae.desktop
      - type: file
        path: com.github.puk06.vrc_avatar_explorer.metainfo.xml
